server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router için — tüm rotalar index.html'e yönlenir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend proxy — Docker içinde backend:8080'e yönlendir
    location /api {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}