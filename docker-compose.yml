version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: finansportal-db
    environment:
      POSTGRES_DB: finansportal
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d finansportal"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    container_name: finansportal-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finansportal
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret123
      SPRING_THREADS_VIRTUAL_ENABLED: true
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: finansportal-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: finansportal-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_LOG_LEVEL: INFO
    ports:
      - "8180:8180"

    restart: unless-stopped
volumes:
  postgres_data: